<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart Civic Complaint Management System — File, track, and resolve civic complaints with intelligent AI categorization.">
    <title>{% block title %}Civiq — Complaint Management{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50:  '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554',
                        },
                        accent: {
                            50:  '#fdf4ff',
                            100: '#fae8ff',
                            400: '#c084fc',
                            500: '#a855f7',
                            600: '#9333ea',
                        },
                        surface: {
                            50:  '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="{% load static %}{% static 'css/styles.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body class="min-h-screen bg-surface-50 text-surface-800 font-sans antialiased">

    <!-- Navbar -->
    {% include 'navbar.html' %}

    <!-- Flash Messages -->
    {% if messages %}
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
        {% for message in messages %}
        <div class="mb-3 px-4 py-3 rounded-lg text-sm font-medium flex items-center gap-2 animate-fade-in
            {% if message.tags == 'success' %} bg-emerald-50 text-emerald-800 border border-emerald-200
            {% elif message.tags == 'error' %} bg-red-50 text-red-800 border border-red-200
            {% elif message.tags == 'warning' %} bg-amber-50 text-amber-800 border border-amber-200
            {% else %} bg-blue-50 text-blue-800 border border-blue-200
            {% endif %}">
            <span>{{ message }}</span>
            <button onclick="this.parentElement.remove()" class="ml-auto text-lg leading-none opacity-60 hover:opacity-100 transition-opacity">&times;</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Page Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include 'footer.html' %}

    <!-- Custom JS -->
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
