{% extends 'base.html' %}
{% block title %}Profile — Civiq{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto py-12 px-4">
    <h1 class="text-2xl font-bold text-surface-900 mb-6">My Profile</h1>
    <div class="bg-white rounded-2xl shadow-xl border border-surface-100 p-8">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="mt-4 px-6 py-3 rounded-xl text-sm font-semibold text-white bg-gradient-to-r from-primary-500 to-primary-600 shadow-lg transition-all">Update Profile</button>
        </form>
    </div>
</div>
{% endblock %}
